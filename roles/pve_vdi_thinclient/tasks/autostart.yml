---
- name: Ensure autostart directory exists
  ansible.builtin.file:
    path: "{{ vdi_autostart_dir }}"
    state: directory
    owner: "{{ vdi_local_user }}"
    group: "{{ vdi_local_user }}"
    mode: "0755"

- name: Ensure openbox config directory exists
  ansible.builtin.file:
    path: "/home/{{ vdi_local_user }}/.config/openbox"
    state: directory
    owner: "{{ vdi_local_user }}"
    group: "{{ vdi_local_user }}"
    mode: "0755"

# Remove legacy .desktop autostart file if it exists from earlier runs.
# We use openbox/autostart directly instead to avoid double-launch.
- name: Remove legacy XDG autostart desktop file (causes double-launch)
  ansible.builtin.file:
    path: "{{ vdi_autostart_dir }}/vdiclient.desktop"
    state: absent

- name: (Optional) Hide cursor when idle
  ansible.builtin.lineinfile:
    path: "/home/{{ vdi_local_user }}/.config/openbox/autostart"
    create: true
    owner: "{{ vdi_local_user }}"
    group: "{{ vdi_local_user }}"
    mode: "0644"
    line: "unclutter -idle 1 -root &"

# Belt-and-suspenders: also launch vdiclient directly from openbox/autostart
# so it runs even if openbox-xdg-autostart / PyXDG is unavailable.
- name: Launch VDI client from openbox autostart (direct, no XDG dependency)
  ansible.builtin.lineinfile:
    path: "/home/{{ vdi_local_user }}/.config/openbox/autostart"
    create: true
    owner: "{{ vdi_local_user }}"
    group: "{{ vdi_local_user }}"
    mode: "0644"
    line: "{{ vdi_launcher }} &"