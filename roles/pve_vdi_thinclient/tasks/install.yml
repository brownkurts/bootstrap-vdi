---
- name: Ensure local user exists
  ansible.builtin.user:
    name: "{{ vdi_local_user }}"
    shell: "{{ vdi_local_user_shell }}"
    create_home: true

- name: Ensure dpkg is not left half-configured
  ansible.builtin.command: dpkg --configure -a
  changed_when: false
  failed_when: false

- name: Remove any apt/dpkg locks (best-effort)
  ansible.builtin.shell: |
    fuser -v /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock /var/lib/apt/lists/lock || true
  changed_when: false
  failed_when: false

- name: Install desktop + prereqs (noninteractive, long-running safe)
  ansible.builtin.apt:
    name: "{{ (vdi_prereq_packages + vdi_desktop_packages) | unique }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
    install_recommends: false
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  async: 7200
  poll: 30

- name: Ensure SSH is enabled (optional)
  ansible.builtin.service:
    name: ssh
    state: started
    enabled: true
  when: vdi_enable_ssh | bool

- name: Install admin SSH keys (optional)
  ansible.posix.authorized_key:
    user: "{{ vdi_local_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ vdi_admin_ssh_pubkeys }}"
  when:
    - vdi_enable_ssh | bool
    - vdi_admin_ssh_pubkeys | length > 0

- name: Install PVE-VDIClient from git
  ansible.builtin.git:
    repo: "https://github.com/joshpatten/PVE-VDIClient.git"
    dest: "{{ vdi_install_dir }}"
    version: "main"
    force: true
    update: true

- name: Install vm_filter_tag patch script
  ansible.builtin.copy:
    dest: "{{ vdi_install_dir }}/patch_vdiclient.py"
    mode: "0755"
    content: |
      #!/usr/bin/env python3
      """Idempotent patch: adds vm_filter_tag support to vdiclient.py"""
      import sys, re
      path = "{{ vdi_install_dir }}/vdiclient.py"
      with open(path) as f:
          src = f.read()

      if 'vm_filter_tag' in src:
          print("already patched")
          sys.exit(0)

      lines = src.splitlines(keepends=True)
      out = []
      i = 0
      while i < len(lines):
          line = lines[i]
          # 1. Add global after guest_type = 'both'
          if line.strip() == "guest_type = 'both'":
              out.append(line)
              out.append("\tvm_filter_tag = None\n")
              i += 1
              continue
          # 2. Read from config — insert after G.guest_type = config[...] assignment
          if re.search(r"G\.guest_type = config\[.General.\]\[.guest_type.\]", line):
              out.append(line)
              indent = "\t\t"
              out.append(f"{indent}if 'vm_filter_tag' in config['General']:\n")
              out.append(f"{indent}\tG.vm_filter_tag = config['General']['vm_filter_tag'] or None\n")
              i += 1
              continue
          # 3. Filter in getvms() — insert inside guest_type if block
          if re.search(r"if G\.guest_type == 'both' or G\.guest_type == vm\['type'\]:", line):
              out.append(line)
              indent = "\t\t\t\t"
              out.append(f"{indent}if G.vm_filter_tag and G.vm_filter_tag not in (vm.get('tags') or '').split(';'):\n")
              out.append(f"{indent}\tcontinue\n")
              i += 1
              continue
          out.append(line)
          i += 1

      with open(path, 'w') as f:
          f.writelines(out)
      print("patched ok")

- name: Patch vdiclient.py — add vm_filter_tag support
  ansible.builtin.command: "python3 {{ vdi_install_dir }}/patch_vdiclient.py"
  register: patch_result
  changed_when: "'patched ok' in patch_result.stdout"

# ---- PEP 668 safe install: use a venv ----
- name: Create Python venv (idempotent)
  ansible.builtin.command: "python3 -m venv {{ vdi_venv_dir }}"
  args:
    creates: "{{ vdi_venv_dir }}/bin/python"

- name: Upgrade pip inside venv
  ansible.builtin.command: "{{ vdi_venv_dir }}/bin/pip install --upgrade pip setuptools wheel"
  changed_when: false

- name: Make requirements.sh executable
  ansible.builtin.file:
    path: "{{ vdi_install_dir }}/requirements.sh"
    mode: "0755"

- name: Run requirements.sh inside venv (bash)
  ansible.builtin.shell: |
    set -euo pipefail
    export VIRTUAL_ENV="{{ vdi_venv_dir }}"
    export PATH="{{ vdi_venv_dir }}/bin:${PATH}"
    . "{{ vdi_venv_dir }}/bin/activate"
    ./requirements.sh
  args:
    chdir: "{{ vdi_install_dir }}"
    executable: /bin/bash
  changed_when: false

# ---- Config + autostart ----
- name: Ensure config directory exists
  ansible.builtin.file:
    path: "{{ vdi_config_dir }}"
    state: directory
    mode: "0755"

- name: Ensure autostart directory exists
  ansible.builtin.file:
    path: "{{ vdi_autostart_dir }}"
    state: directory
    owner: "{{ vdi_local_user }}"
    group: "{{ vdi_local_user }}"
    mode: "0755"

# This wrapper prevents “black screen” because it always runs with the venv python
- name: Install launcher wrapper
  ansible.builtin.copy:
    dest: "{{ vdi_launcher }}"
    mode: "0755"
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      exec "{{ vdi_venv_dir }}/bin/python" "{{ vdi_app_entry }}" "$@"

# Make sure lightdm is enabled; black screen often = display manager not starting
- name: Ensure LightDM is enabled and started
  ansible.builtin.service:
    name: lightdm
    enabled: true
    state: started
# NOTE: reboot is handled by site.yml (fire-and-forget async) so ansible-pull
# finishes cleanly before the machine restarts. Do NOT add reboot here.