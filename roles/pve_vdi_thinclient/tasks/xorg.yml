---
# xorg.yml — write a minimal xorg.conf so Xorg doesn't fail with "no screens found"
# on VMs or hardware where autodetection fails.  On real hardware with a proper GPU
# (Intel / AMD / NVIDIA) modesetting takes over and this file is silently ignored.

- name: Ensure /etc/X11 exists
  ansible.builtin.file:
    path: /etc/X11
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Write fallback xorg.conf (vmware → fbdev → vesa cascade)
  ansible.builtin.copy:
    dest: /etc/X11/xorg.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Minimal xorg.conf written by bootstrap-vdi
      # Driver priority: modesetting (DRM/KMS) > vmware > fbdev > vesa
      # On real hardware with Intel/AMD/NVIDIA the modesetting driver takes
      # over automatically and this file is effectively ignored.
      # On VMs (Proxmox vga:vmware or vga:virtio) vmware/modesetting handles it.

      Section "Device"
          Identifier  "VDI Display"
          Driver      "modesetting"
          Option      "AccelMethod" "none"
      EndSection

      Section "Screen"
          Identifier  "VDI Screen"
          Device      "VDI Display"
          DefaultDepth 24
          SubSection "Display"
              Depth    24
          EndSubSection
      EndSection

      Section "Monitor"
          Identifier  "VDI Monitor"
          Option      "DPMS"    "false"
          Option      "DPMSMode" "off"
      EndSection

      Section "ServerLayout"
          Identifier  "VDI Layout"
          Screen      "VDI Screen"
      EndSection

      Section "ServerFlags"
          Option "AutoAddDevices" "true"
          Option "AllowEmptyInput" "true"
      EndSection
